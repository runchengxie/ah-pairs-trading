[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ah-pairs-trading"
version = "0.1.0"
description = "An A/H relative-value research project built around cointegration analysis and cost-aware backtesting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.16.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
pairs-trading = "ah_pairs_trading.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: end-to-end pipeline tests that exercise multiple layers together",
]
filterwarnings = [
  "error",
  "ignore:No frequency information was provided, so inferred frequency B will be used\\.:statsmodels.tools.sm_exceptions.ValueWarning",
  "ignore:invalid value encountered in sqrt:RuntimeWarning",
]
